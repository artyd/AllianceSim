services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      EDIT_TOKEN: ${EDIT_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}   # for Mini App initData verification
      COFFEE_HR_TG: ${COFFEE_HR_TG:-}             # coffee orders → this telegram id (wins)
      COFFEE_HR_NAME: ${COFFEE_HR_NAME:-}         # …or this linked employee by name
      COFFEE_ALLOWED: ${COFFEE_ALLOWED:-Мороз Ольга,Руслан Зубар,Станіслав,Станислав}  # who may order coffee (names, any word order)
      # Personal phone (spec 004)
      UPLOAD_DIR: /data/uploads                    # chat attachments (volume below)
      ATTACHMENT_TTL_DAYS: ${ATTACHMENT_TTL_DAYS:-90}
      ME_INITDATA_MAX_AGE: ${ME_INITDATA_MAX_AGE:-86400}  # private data: initData freshness window (s)
      CHECKIN_HOUR: ${CHECKIN_HOUR:-9}             # task "deadline today" pings from this hour
      CHECKIN_TZ: ${CHECKIN_TZ:-Europe/Kyiv}       # reminders / digest timezone
      ANNOUNCE_ALLOWED: ${ANNOUNCE_ALLOWED:-*}     # who may post 📢 announcements from the Mini App (names; * = everyone)
      # HR analytics v2 (spec 008): who gets the «Аналітика» app in the Mini App + weekly/monthly reports
      HR_NAMES: ${HR_NAMES:-Тахтаулова,Свистельник}  # linked employees by name (comma list; every word of an entry must match)
      HR_TG_IDS: ${HR_TG_IDS:-}                   # …and/or telegram ids (comma list)
    volumes:
      - uploads:/data/uploads
    # Loopback-only: nothing exposed publicly — Caddy fronts TLS and routing.
    ports:
      - "127.0.0.1:${PORT}:${PORT}"

  bot:
    build: ./bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started
    environment:
      API_URL: http://api:${PORT}/api
      EDIT_TOKEN: ${EDIT_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CHECKIN_HOUR: ${CHECKIN_HOUR:-9}
      CHECKIN_TZ: ${CHECKIN_TZ:-Europe/Kyiv}
      WEBAPP_URL: ${WEBAPP_URL:-}   # https URL of the site → opened as a Telegram Mini App
      REPORT_HOUR: ${REPORT_HOUR:-10}             # weekday HR report (status/mood card), Kyiv time
      REPORT_HR_NAME: ${REPORT_HR_NAME:-}         # report recipient (linked employee); empty → COFFEE_HR_*
      COFFEE_HR_NAME: ${COFFEE_HR_NAME:-}
      REPORT_HR_TG: ${REPORT_HR_TG:-}             # …or telegram id (wins)
      COFFEE_HR_TG: ${COFFEE_HR_TG:-}
      REPORT_VIEWERS: ${REPORT_VIEWERS:-Артем Свистельник}  # may also run /report (names, any word order)
      ANALYTICS_REPORT_HOUR: ${ANALYTICS_REPORT_HOUR:-10}  # spec 008: weekly (Mon) + monthly (1st) Excel/PDF to HR_NAMES, Kyiv time
    # Long polling — no inbound ports, only outbound to Telegram + the api service.

  # Daily pg_dump + attachments archive into ./backups on the host (spec 005).
  # Make one right now:  sudo docker compose exec backup sh /backup.sh now
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-1}
    volumes:
      - ./backups:/backups
      - uploads:/uploads:ro
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]

volumes:
  pgdata:
  uploads:
